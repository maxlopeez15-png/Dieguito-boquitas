<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f4ef">
<title>Dieguito Boquitas</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#20232b;background:#f7f4ef}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 12%,#fff 0,#f7f4ef 65%,#eee9e1 100%)}
main{width:min(100%,620px);padding:30px 22px 26px;text-align:center;border:1px solid #e8e2d9;border-radius:28px;background:#ffffffdf;box-shadow:0 22px 70px #2f251a19}
.eyebrow{margin:0 0 9px;color:#9a7553;font-size:11px;font-weight:800;letter-spacing:.2em}
h1{margin:0;font-size:clamp(32px,7vw,48px);letter-spacing:-.045em}
.instruction{margin:10px 0 22px;color:#737782;font-size:15px}
.diego{position:relative;display:block;width:min(100%,390px);margin:auto;padding:0;border:0;border-radius:22px;overflow:hidden;background:#ddd;cursor:pointer;box-shadow:0 16px 35px #1e191e2e;transition:transform .18s,box-shadow .18s;-webkit-tap-highlight-color:transparent}
.diego:hover{transform:translateY(-3px);box-shadow:0 20px 42px #1e191e38}
.diego:active{transform:scale(.985)}
.diego img{display:block;width:100%;height:auto}
.mouth{position:absolute;left:50.9%;top:22.25%;width:8.2%;height:1.25%;opacity:0;transform:translateY(0) scaleY(.1);transform-origin:center;border-radius:50%;background:#5b2024;box-shadow:0 0 0 1px #743a3c66;transition:opacity .13s,height .18s,transform .18s;overflow:hidden;pointer-events:none}
.mouth:before{content:"";position:absolute;left:9%;top:0;width:82%;height:24%;background:#f5e5d5;border-radius:0 0 45% 45%;opacity:0}
.mouth:after{content:"";position:absolute;left:22%;bottom:0;width:56%;height:24%;background:#b94f5a;border-radius:50% 50% 35% 35%;opacity:0}
.diego.is-open .mouth{height:3.1%;opacity:1;transform:translateY(1px) scaleY(1);animation:talk .22s ease-in-out infinite alternate}
.diego.is-open .mouth:before,.diego.is-open .mouth:after{opacity:1}
.tap{position:absolute;right:12px;bottom:12px;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#ffffffe8;box-shadow:0 3px 12px #0002;font-size:21px;transition:opacity .2s}
.diego.is-open .tap{opacity:0}
.status{margin:20px 0 0;min-height:24px;color:#4e5662;font-weight:650}
.footer{margin:12px 0 0;color:#a1a3a8;font-size:12px}
@keyframes talk{from{transform:translateY(1px) scaleY(.88)}to{transform:translateY(1px) scaleY(1.08)}}
button:focus-visible{outline:4px solid #a7794f;outline-offset:5px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main>
<p class="eyebrow">EXPERIMENTO SOCIAL</p>
<h1>Dieguito Boquitas</h1>
<p class="instruction">Pícale a la foto para que abra y cierre la boca.</p>
<button class="diego" id="diego" type="button" aria-label="Abrir o cerrar la boca de Diego" aria-pressed="false">
<img src="assets/diego.jpg" alt="Diego, con sudadera blanca, sentado al fondo">
<span class="mouth" aria-hidden="true"></span>
<span class="tap" aria-hidden="true">👆</span>
</button>
<p class="status" id="status" aria-live="polite">Diego está calladito. 🤐</p>
<p class="footer">Un clic = una sorpresa.</p>
</main>
<script>
const diego=document.querySelector("#diego");
const status=document.querySelector("#status");
diego.addEventListener("click",()=>{
 const isOpen=diego.classList.toggle("is-open");
 diego.setAttribute("aria-pressed",String(isOpen));
 status.textContent=isOpen?"¡Diego ya está hablando! 😮":"Diego está calladito. 🤐";
});
</script>
</body>
</html>
