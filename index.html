<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff7df">
<title>Patito Boquitas 🐥</title>
<style>
:root{font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;color:#29251d;background:#fff7df}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 20% 10%,#fff 0,#fff7df 62%,#ffedb5 100%)}
main{width:min(100%,560px);padding:28px 22px 24px;text-align:center;border:2px solid #f5cf55;border-radius:30px;background:#fffdf7;box-shadow:0 18px 55px #75531a1c}
.ducks{font-size:30px;letter-spacing:18px;margin-bottom:4px}
h1{margin:0;color:#e6a900;font-size:clamp(34px,8vw,52px);line-height:1.05;font-weight:950;letter-spacing:-.05em;text-shadow:1px 2px 0 #4b3512}
.instruction{margin:13px 0 22px;color:#5e5545;font-weight:650;font-size:15px}
.photo-button{display:block;position:relative;width:min(100%,410px);aspect-ratio:1;margin:auto;padding:0;overflow:hidden;border:5px solid #ffd84c;border-radius:24px;background:#eee;cursor:pointer;box-shadow:0 12px 28px #47320e2a;transition:transform .18s,box-shadow .18s;-webkit-tap-highlight-color:transparent}
.photo-button:hover{transform:translateY(-3px);box-shadow:0 17px 34px #47320e36}
.photo-button:active{transform:scale(.985)}
.photo-button img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 35%}
.tap{position:absolute;left:50%;bottom:13px;transform:translateX(-50%);white-space:nowrap;padding:10px 18px;border:2px solid #fff;border-radius:999px;background:#241b0fe8;color:#fff;font-weight:850;box-shadow:0 4px 14px #0004}
.status{margin:19px 0 0;min-height:25px;font-weight:850;color:#6d5012;font-size:18px}
.footer{margin:9px 0 0;color:#a08d67;font-size:12px}
button:focus-visible{outline:4px solid #a7794f;outline-offset:5px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<div class="ducks" aria-hidden="true">🐥 🐤 🐥</div>
<h1>Patito Boquitas</h1>
<p class="instruction">Pícale a la foto para que abra y cierre la boca.</p>
<button class="photo-button" id="patito" type="button" aria-label="Activar o detener la animación de Patito Boquitas" aria-pressed="false">
<img id="portrait" src="assets/diego.jpg" alt="Retrato original en el salón de clases">
<span class="tap" id="tap">🐤 ¡Pícale al patito!</span>
</button>
<p class="status" id="status" aria-live="polite">Está calladito… 🤐</p>
<p class="footer">Un clic para hacerlo hablar. Otro para dejarlo descansar.</p>
</main>
<script>
const button=document.querySelector("#patito");
const portrait=document.querySelector("#portrait");
const tap=document.querySelector("#tap");
const status=document.querySelector("#status");
let talking=false;
button.addEventListener("click",()=>{
 talking=!talking;
 portrait.src=talking?"assets/patito-boquitas.gif":"assets/diego.jpg";
 button.setAttribute("aria-pressed",String(talking));
 tap.textContent=talking?"🐥 ¡Ya está hablando!":"🐤 ¡Pícale al patito!";
 status.textContent=talking?"¡PATITO BOQUITAS ESTÁ HABLANDO! 😮":"Está calladito… 🤐";
});
</script>
</body>
</html>
