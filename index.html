<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff7df">
<title>Patito Boquitas 🐥</title>
<style>
:root{font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;color:#29251d;background:#fff7df}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 20% 10%,#fff 0,#fff7df 62%,#ffedb5 100%)}
main{width:min(100%,560px);padding:28px 22px 24px;text-align:center;border:2px solid #f5cf55;border-radius:30px;background:#fffdf7;box-shadow:0 18px 55px #75531a1c}
.ducks{font-size:30px;letter-spacing:12px;margin-bottom:4px}
h1{margin:0;color:#e6a900;font-size:clamp(34px,8vw,52px);line-height:1.05;font-weight:950;letter-spacing:-.05em;text-shadow:1px 2px 0 #4b3512}
.instruction{margin:13px 0 22px;color:#5e5545;font-weight:650;font-size:15px}
.stage{position:relative;display:block;width:min(100%,280px);aspect-ratio:1;margin:auto;padding:0;overflow:hidden;border:5px solid #ffd84c;border-radius:24px;background:#eee;cursor:pointer;box-shadow:0 12px 28px #47320e2a;transition:transform .18s,box-shadow .18s;-webkit-tap-highlight-color:transparent}
.stage:hover{transform:translateY(-3px);box-shadow:0 17px 34px #47320e36}
.stage:active{transform:scale(.985)}
.stage:disabled{cursor:wait;opacity:.85}
.stage canvas,.stage img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover}
.stage img{opacity:0;transition:opacity .05s}
.stage.playing img{opacity:1}
.stage.playing canvas{opacity:0}
.status{margin:19px 0 0;min-height:25px;font-weight:900;color:#6d5012;font-size:19px}
.footer{margin:9px 0 0;color:#a08d67;font-size:12px}
button:focus-visible{outline:4px solid #a7794f;outline-offset:5px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<main>
<div class="ducks" aria-hidden="true">🐥 🐤 🐥</div>
<h1>Patito Boquitas</h1>
<p class="instruction">Toca la imagen para que abra la boca y diga quack quack.</p>
<button class="stage" id="stage" type="button" aria-label="Reproducir la animación de Patito Boquitas" aria-pressed="false" disabled>
<canvas id="still" width="192" height="192" aria-hidden="true"></canvas>
<img id="animation" alt="Patito Boquitas abre la boca y dice Quack Quack">
</button>
<p class="status" id="status" aria-live="polite">Preparando al patito… 🐤</p>
<p class="footer">Un toque para reproducir. Otro para detener.</p>
</main>
<script>
const stage=document.querySelector("#stage");
const canvas=document.querySelector("#still");
const ctx=canvas.getContext("2d");
const animation=document.querySelector("#animation");
const status=document.querySelector("#status");
let gifBytes=null,playing=false,stopTimer=null,quackTimers=[],audioContext=null,currentURL=null;

async function prepare(){
  try{
    const names=["patito-gif-1.txt","patito-gif-2.txt","patito-gif-3.txt","patito-gif-4.txt","patito-gif-5.txt"];
    const parts=await Promise.all(names.map(async name=>{
      const response=await fetch("assets/"+name);
      if(!response.ok)throw new Error("No se pudo cargar "+name);
      return response.text();
    }));
    const binary=atob(parts.join(""));
    gifBytes=Uint8Array.from(binary,char=>char.charCodeAt(0));
    const previewURL=URL.createObjectURL(new Blob([gifBytes],{type:"image/gif"}));
    const preview=new Image();
    preview.onload=()=>{
      ctx.drawImage(preview,0,0,canvas.width,canvas.height);
      URL.revokeObjectURL(previewURL);
      stage.disabled=false;
      status.textContent="¡Listo para hacer QUACK! 🐤";
    };
    preview.onerror=()=>{URL.revokeObjectURL(previewURL);status.textContent="No se pudo cargar el patito. Recarga la página.";};
    preview.src=previewURL;
  }catch(error){status.textContent="No se pudo preparar la animación. Recarga la página.";}
}

function quack(){
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass)return;
  audioContext ||= new AudioContextClass();
  if(audioContext.state==="suspended")audioContext.resume();
  const now=audioContext.currentTime;
  const osc=audioContext.createOscillator(),filter=audioContext.createBiquadFilter(),gain=audioContext.createGain();
  osc.type="sawtooth";
  osc.frequency.setValueAtTime(520,now);
  osc.frequency.exponentialRampToValueAtTime(155,now+0.19);
  filter.type="lowpass";
  filter.frequency.setValueAtTime(1100,now);
  filter.frequency.exponentialRampToValueAtTime(520,now+0.2);
  gain.gain.setValueAtTime(0.0001,now);
  gain.gain.exponentialRampToValueAtTime(0.22,now+0.018);
  gain.gain.exponentialRampToValueAtTime(0.0001,now+0.22);
  osc.connect(filter);filter.connect(gain);gain.connect(audioContext.destination);
  osc.start(now);osc.stop(now+0.23);
}
function stop(){
  playing=false;
  clearTimeout(stopTimer);
  quackTimers.forEach(clearTimeout);
  quackTimers=[];
  stage.classList.remove("playing");
  stage.setAttribute("aria-pressed","false");
  animation.removeAttribute("src");
  if(currentURL){URL.revokeObjectURL(currentURL);currentURL=null;}
  status.textContent="¡Listo para hacer QUACK! 🐤";
}
stage.addEventListener("click",()=>{
  if(playing){stop();return;}
  if(!gifBytes)return;
  playing=true;
  stage.classList.add("playing");
  stage.setAttribute("aria-pressed","true");
  status.textContent="¡QUACK! ¡QUACK! 🐥";
  currentURL=URL.createObjectURL(new Blob([gifBytes],{type:"image/gif"}));
  animation.src=currentURL;
  quackTimers=[setTimeout(quack,320),setTimeout(quack,555)];
  stopTimer=setTimeout(stop,820);
});
prepare();
</script>
</body>
</html>
