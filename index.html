<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff7df">
<title>Patito Boquitas 🐥</title>
<style>
:root{font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;color:#29251d;background:#fff7df}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 20% 10%,#fff 0,#fff7df 62%,#ffedb5 100%)}
main{width:min(100%,560px);padding:28px 22px 24px;text-align:center;border:2px solid #f5cf55;border-radius:30px;background:#fffdf7;box-shadow:0 18px 55px #75531a1c}
.ducks{font-size:30px;letter-spacing:12px;margin-bottom:4px}
h1{margin:0;color:#e6a900;font-size:clamp(34px,8vw,52px);line-height:1.05;font-weight:950;letter-spacing:-.05em;text-shadow:1px 2px 0 #4b3512}
.instruction{margin:13px 0 22px;color:#5e5545;font-weight:650;font-size:15px}
.patito{display:block;width:min(100%,360px);aspect-ratio:1;margin:auto;padding:0;overflow:hidden;border:5px solid #ffd84c;border-radius:24px;background:#eee;cursor:pointer;box-shadow:0 12px 28px #47320e2a;transition:transform .18s,box-shadow .18s;-webkit-tap-highlight-color:transparent}
.patito:hover{transform:translateY(-3px);box-shadow:0 17px 34px #47320e36}
.patito:active{transform:scale(.985)}
.patito img{display:block;width:100%;height:100%;object-fit:cover}
.status{margin:19px 0 0;min-height:25px;font-weight:850;color:#6d5012;font-size:18px}
.footer{margin:9px 0 0;color:#a08d67;font-size:12px}
button:focus-visible{outline:4px solid #a7794f;outline-offset:5px}
</style>
</head>
<body>
<main>
<div class="ducks" aria-hidden="true">🐥 🐤 🐥</div>
<h1>Patito Boquitas</h1>
<p class="instruction">Pícale al patito para volver a iniciar su animación.</p>
<button class="patito" id="patito" type="button" aria-label="Reiniciar la animación de Patito Boquitas">
<img id="gif" src="assets/patito-boquitas.gif" alt="Patito Boquitas abre y cierra la boca en una animación">
</button>
<p class="status" id="status" aria-live="polite">¡Cuac, cuac! 🐤</p>
<p class="footer">Un clic y vuelve a empezar.</p>
</main>
<script>
const button=document.querySelector("#patito");
const gif=document.querySelector("#gif");
const status=document.querySelector("#status");
button.addEventListener("click",()=>{
  const src="assets/patito-boquitas.gif";
  gif.src=src+"?restart="+Date.now();
  status.textContent="¡Otra vez, cuac! 🐥";
});
</script>
</body>
</html>
